name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      # The Keyring and the tray app target Windows (Hello, TPM, WPF), so only the Windows leg builds
      # the whole solution; the Linux leg tests the cross-platform libraries and the app's Logic/.
      - name: Build (solution, including the app)
        if: runner.os == 'Windows'
        run: dotnet build Tiresias.slnx -c Release
      - name: Build the sample
        if: runner.os == 'Windows'
        run: dotnet build samples/ProtectedSecretsSample/ProtectedSecretsSample.csproj -c Release
      - name: Test
        # A hung test fails after 5 minutes and is named in the log, instead of holding the runner.
        run: dotnet test src/Tiresias.Tests/Tiresias.Tests.csproj -c Release --blame-hang-timeout 5m --blame-hang-dump-type none
      - name: Pack
        if: runner.os == 'Windows'
        run: dotnet pack Tiresias.slnx -c Release -o artifacts

  denylist:
    # Names that must never land here (hosts, people, customers). The list lives in a repository
    # secret so it is not itself published; matches report the file only, never the text.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for denied names
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then echo "No denylist secret available; skipped."; exit 0; fi
          printf '%s\n' "$DENYLIST" | sed '/^[[:space:]]*$/d; /^[[:space:]]*#/d' > "$RUNNER_TEMP/deny.txt"
          if grep -rliF -f "$RUNNER_TEMP/deny.txt" --exclude-dir=.git . ; then
            echo "::error::Denied names found in the files listed above."
            exit 1
          fi
