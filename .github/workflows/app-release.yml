name: app-release

# The desktop app (Tiresias.exe plus tir), packaged with Velopack and published as a GitHub
# release that installed apps update from. Separate from release.yml, which publishes the NuGet
# packages on v* tags: the app and the libraries version independently.
on:
  push:
    tags: ['app-v*']

permissions:
  contents: write # create the release and upload the packages
  id-token: write # sign in to Azure through GitHub OIDC: no stored secret

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    # The Azure federated credential trusts this environment, not a tag name (it takes no wildcards).
    environment: app-release
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      # Everything signing needs comes from variables (repository or environment); no values live in
      # this file. docs/releasing.md has the one-time Azure setup that produces them.
      - name: Check signing configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            eval "value=\${$name:-}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Code signing is not set up::Missing repository variables:$missing. An unsigned release is not published. See docs/releasing.md, 'One-time Azure setup'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Version and release notes
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          sh .github/scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Test
        run: dotnet test src/Tiresias.Tests/Tiresias.Tests.csproj -c Release

      # Self-contained: installing the app doesn't need a .NET runtime. tir ships in the same folder.
      # Once per architecture: x64, and Arm64 so Windows on Arm runs it natively, not emulated.
      # The admin tier's service goes in its own admin\ folder, which its install step copies to
      # %ProgramFiles% (docs/admin-tier.md): self-contained, it needs nothing else from the app's folder.
      - name: Publish
        shell: bash
        run: |
          v="${{ steps.meta.outputs.version }}"
          for rid in win-x64 win-arm64; do
            dotnet publish src/Tiresias.App -c Release -r $rid --self-contained -p:Version="$v" -o publish/$rid
            dotnet publish src/Tiresias.Keyring -c Release -r $rid --self-contained -p:Version="$v" -o publish/$rid
            dotnet publish src/Tiresias.NuGetPlugin -c Release -r $rid --self-contained -p:Version="$v" -o publish/$rid
            dotnet publish src/Tiresias.Admin -c Release -r $rid --self-contained -p:PublishSingleFile=true -p:Version="$v" -o publish/$rid/admin
          done
          # tir-remote for devcontainers (docs/devcontainers.md): release assets, not part of the app's package.
          sh .github/scripts/publish-tir-remote.sh "$v" tir-remote-assets

      - name: Azure sign-in (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Signing metadata
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/signing.json" <<JSON
          {
            "Endpoint": "${{ vars.AZURE_SIGNING_ENDPOINT }}",
            "CodeSigningAccountName": "${{ vars.AZURE_SIGNING_ACCOUNT }}",
            "CertificateProfileName": "${{ vars.AZURE_SIGNING_PROFILE }}"
          }
          JSON

      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.161

      # The previous release's full package lets vpk build a delta, so updates download only what changed.
      # Each architecture is its own Velopack channel, so an install only ever updates to its own.
      # x64 keeps the default channel ("win") that every install before Arm64 builds is on.
      - name: Previous release
        shell: bash
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases --pre || true
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases --pre --channel win-arm64 || true

      - name: Pack
        shell: bash
        run: |
          # Not "Tiresias": Velopack installs to %LOCALAPPDATA%\{packId} and deletes that whole folder on
          # uninstall, and %LOCALAPPDATA%\Tiresias holds the vault and the device key. PackagingTests guards it.
          for rid in win-x64 win-arm64; do
            channel=""; [ "$rid" = "win-arm64" ] && channel="--channel win-arm64"
            vpk pack --packId TiresiasApp --packTitle Tiresias --packAuthors "Tiresias contributors" \
              --packVersion "${{ steps.meta.outputs.version }}" --packDir publish/$rid --mainExe Tiresias.exe \
              --runtime $rid $channel \
              --icon assets/export/tiresias.ico --releaseNotes "$RUNNER_TEMP/notes.md" --outputDir Releases \
              --azureTrustedSignFile "$RUNNER_TEMP/signing.json"
          done

      # vpk signs Tiresias.exe, tir.exe and every other unsigned binary in the package, then the
      # installer. Stop here if anything users run came out unsigned or untimestamped: check each
      # installer and the two executables inside each full package that updates install. Artifact
      # Signing certificates live three days, so a signature without a timestamp stops verifying
      # three days after the release.
      - name: Verify signatures
        shell: pwsh
        run: |
          $fulls = @(Get-ChildItem Releases -Filter "*-${{ steps.meta.outputs.version }}*-full.nupkg")
          $files = @()
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/full" | Out-Null   # Copy-Item makes no parent folder
          foreach ($full in $fulls) {
            $into = "$env:RUNNER_TEMP/full/$($full.BaseName)"
            Copy-Item $full.FullName "$into.zip"   # Expand-Archive only takes a .zip name
            Expand-Archive "$into.zip" -DestinationPath $into -Force
            $files += @(Get-ChildItem $into -Include Tiresias.exe, tir.exe -Recurse)
          }
          $files += @(Get-ChildItem Releases -Filter *-Setup.exe)
          $bad = $files | Where-Object { $s = Get-AuthenticodeSignature $_.FullName; $s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate }
          # Two architectures: two full packages, each with two executables, and two installers.
          if ($fulls.Count -lt 2 -or $files.Count -lt 6 -or $bad) {
            Write-Output "::error title=Unsigned or untimestamped files::$($bad.Name -join ', ')"
            exit 1
          }
          $files | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "{0}: {1}, timestamped by {2}" -f $_.Name, $s.SignerCertificate.Subject, $s.TimeStamperCertificate.Subject }

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.meta.outputs.version }}"
          pre=""; [ "${{ steps.meta.outputs.prerelease }}" = "true" ] && pre="--prerelease"
          # Only this version's files: the downloaded previous package is already on its own release.
          mapfile -d '' files < <(find Releases -maxdepth 1 -type f \( -name "*$v*" -o -name "*-Setup.exe" -o -name "*-Portable.zip" -o -name "releases.*.json" -o -name "RELEASES*" -o -name "assets.*.json" \) -print0)
          files+=(tir-remote-assets/*)
          # One call: gh creates a draft, uploads the files, then publishes. Releases here are immutable,
          # so nothing can be added once a release is published, and its tag can never be reused.
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tiresias app $v" --notes-file "$RUNNER_TEMP/notes.md" $pre "${files[@]}"

  # The devcontainer feature (devcontainer-features/src/tiresias) at ghcr.io, versioned with the app.
  # It carries this release's tir-remote checksums, so install.sh only installs what this release
  # built. Prereleases don't publish it: the feature's tags are major, major.minor and full version.
  feature:
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the feature to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Pin the version and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          dir=devcontainer-features/src/tiresias
          gh release download "$GITHUB_REF_NAME" --pattern tir-remote.sha256 --dir "$dir"
          printf '%s
' "$v" > "$dir/tir-remote.version"
          jq --arg v "$v" '.version = $v' "$dir/devcontainer-feature.json" > "$RUNNER_TEMP/feature.json"
          mv "$RUNNER_TEMP/feature.json" "$dir/devcontainer-feature.json"
          cat "$dir/tir-remote.sha256"
      - uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: ./devcontainer-features/src
          features-namespace: hansen-consultancy/devcontainer-features
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
