name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release carrying the changelog section
  id-token: write # nuget.org trusted publishing: no stored API key

jobs:
  publish:
    runs-on: windows-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      # First, so a release without its CHANGELOG.md section stops before anything is pushed.
      - name: Release notes
        shell: bash
        run: sh .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: Test
        run: dotnet test src/Tiresias.Tests/Tiresias.Tests.csproj -c Release
      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack Tiresias.slnx -c Release -o artifacts -p:Version="$version"
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name of the account that created the trusted-publishing policy (owner
          # hansen-consultancy, repo Tiresias, release.yml). Kept in a secret so it isn't published.
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        shell: bash
        # One file at a time: on Windows, dotnet nuget push does not expand "artifacts/*.nupkg".
        # Each .nupkg push also uploads the matching .snupkg.
        run: |
          for f in artifacts/*.nupkg; do
            dotnet nuget push "$f" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          pre=""; case "$version" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tiresias packages $version" --notes-file "$RUNNER_TEMP/notes.md" $pre
