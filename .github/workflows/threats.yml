name: threats

on:
  push:
    branches: [main]
    paths: ["docs/threats/**", "tools/threats.py", ".github/workflows/threats.yml"]
  pull_request:
    paths: ["docs/threats/**", "tools/threats.py", ".github/workflows/threats.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate findings
        run: python3 -I tools/threats.py --check
      - name: Summary
        run: python3 -I tools/threats.py >> "$GITHUB_STEP_SUMMARY"
